[workspace]
resolver = "2"
members = [
    "crates/provio-core",
    "crates/provio-policy",
    "crates/provio-ledger",
    "crates/provio-mcp",
    "crates/provio-sandbox",
    "crates/provio-replay",
    "crates/provio-otel",
    "crates/provio-tui",
    "crates/provio-cli",
    "crates/provio-policy-rego",
    "crates/provio-policy-cedar",
    "crates/provio-sandbox-docker",
    "crates/provio-receipts",
    "crates/provio-wasm",
]

[workspace.package]
version = "0.1.5"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/writ-agent/provio"
homepage = "https://getprovio.vercel.app"
description = "Authorization and provenance for AI agents. One policy file, one tamper-evident ledger, any agent."

[workspace.dependencies]
provio-core = { path = "crates/provio-core" }
provio-policy = { path = "crates/provio-policy" }
provio-ledger = { path = "crates/provio-ledger" }
provio-mcp = { path = "crates/provio-mcp" }
provio-sandbox = { path = "crates/provio-sandbox" }
provio-replay = { path = "crates/provio-replay" }
provio-otel = { path = "crates/provio-otel" }
provio-tui = { path = "crates/provio-tui" }
provio-policy-rego = { path = "crates/provio-policy-rego" }
provio-policy-cedar = { path = "crates/provio-policy-cedar" }
provio-sandbox-docker = { path = "crates/provio-sandbox-docker" }
provio-receipts = { path = "crates/provio-receipts" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
sha2 = "0.11"
hex = "0.4"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
# NOTE: default features that pull in windows-sys (color/ansi) are disabled —
# this environment's binutils can't build raw-dylib import libs (ADR-006).
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
ratatui = "0.29"
crossterm = "0.28"
rusqlite = { version = "0.40", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
