<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" role="img"
     aria-label="provio: a safety floor your AI agents can't get under. A tool call passes a policy gate (allow, deny, ask, redact) and is recorded in a hash-chained ledger.">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1e2933"/>
    </pattern>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#4ec9a5" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4ec9a5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16202a"/>
      <stop offset="1" stop-color="#10161d"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5c6b7a"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, "Cascadia Mono", "JetBrains Mono", Consolas, "SF Mono", Menlo, monospace; }
    </style>
  </defs>

  <rect width="1280" height="440" rx="20" fill="#0b0f14"/>
  <rect width="1280" height="440" rx="20" fill="url(#dots)"/>
  <rect width="1280" height="440" rx="20" fill="url(#glow)"/>
  <rect x="1" y="1" width="1278" height="438" rx="19" fill="none" stroke="#1e2933" stroke-width="2"/>

  <!-- wordmark -->
  <g transform="translate(72 64) scale(0.56)">
  <g fill="none" stroke="#dbe4ec" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 42 V116"/>
    <circle cx="40" cy="70" r="28"/>
    <path d="M92 98 V42 M92 66 C92 50 104 42 122 42"/>
    <circle cx="162" cy="70" r="28"/>
    <path d="M208 42 L230 98 L252 42"/>
    <path d="M276 98 V42"/>
    <circle cx="324" cy="70" r="28"/>
  </g>
  <circle cx="276" cy="18" r="7.5" fill="#dbe4ec"/>
  <circle cx="374" cy="91" r="10" fill="#4ec9a5"/>
  </g>
  <text x="72" y="204" class="sans" font-size="42" font-weight="700" fill="#dbe4ec">A safety floor</text>
  <text x="72" y="252" class="sans" font-size="42" font-weight="700" fill="#dbe4ec">your AI agents</text>
  <text x="72" y="300" class="sans" font-size="42" font-weight="700" fill="#dbe4ec">can't get under<tspan fill="#4ec9a5">.</tspan></text>
  <text x="72" y="342" class="sans" font-size="18" fill="#8a99a8">One policy for every agent, checked before every call.</text>
  <text x="72" y="366" class="sans" font-size="18" fill="#8a99a8">Kernel backstop. Signed, tamper-evident ledger.</text>
  <text x="72" y="404" class="mono" font-size="15" fill="#5c6b7a">$ pip install provio &amp;&amp; provio scan</text>

  <!-- agent -->
  <g transform="translate(640 176)">
    <rect width="132" height="88" rx="14" fill="url(#card)" stroke="#1e2933" stroke-width="2"/>
    <text x="66" y="38" class="mono" font-size="15" fill="#8a99a8" text-anchor="middle">agent</text>
    <text x="66" y="62" class="mono" font-size="13" fill="#5c6b7a" text-anchor="middle">tool call</text>
  </g>
  <path d="M780 220 H832" stroke="#5c6b7a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- policy gate -->
  <g transform="translate(842 118)">
    <rect width="176" height="204" rx="16" fill="url(#card)" stroke="#4ec9a5" stroke-opacity="0.55" stroke-width="2"/>
    <text x="88" y="34" class="mono" font-size="15" fill="#dbe4ec" text-anchor="middle">provio.yaml</text>
    <g class="mono" font-size="14" text-anchor="middle">
      <rect x="24" y="52" width="128" height="28" rx="14" fill="#3fb950" fill-opacity="0.14" stroke="#3fb950" stroke-opacity="0.6"/>
      <text x="88" y="71" fill="#3fb950">allow</text>
      <rect x="24" y="88" width="128" height="28" rx="14" fill="#f85149" fill-opacity="0.14" stroke="#f85149" stroke-opacity="0.6"/>
      <text x="88" y="107" fill="#f85149">deny</text>
      <rect x="24" y="124" width="128" height="28" rx="14" fill="#d29922" fill-opacity="0.14" stroke="#d29922" stroke-opacity="0.6"/>
      <text x="88" y="143" fill="#d29922">ask a human</text>
      <rect x="24" y="160" width="128" height="28" rx="14" fill="#a371f7" fill-opacity="0.14" stroke="#a371f7" stroke-opacity="0.6"/>
      <text x="88" y="179" fill="#a371f7">redact</text>
    </g>
  </g>
  <path d="M1026 220 H1078" stroke="#5c6b7a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ledger: hash chain -->
  <g class="mono" font-size="12" text-anchor="middle">
    <g transform="translate(1088 96)">
      <rect width="120" height="60" rx="10" fill="url(#card)" stroke="#1e2933" stroke-width="2"/>
      <text x="60" y="26" fill="#8a99a8">#0 decision</text>
      <text x="60" y="44" fill="#5c6b7a">9f3a…e1c0</text>
    </g>
    <path d="M1148 158 V178" stroke="#4ec9a5" stroke-width="2" stroke-dasharray="3 3"/>
    <g transform="translate(1088 180)">
      <rect width="120" height="60" rx="10" fill="url(#card)" stroke="#1e2933" stroke-width="2"/>
      <text x="60" y="26" fill="#8a99a8">#1 execution</text>
      <text x="60" y="44" fill="#5c6b7a">4b07…a92d</text>
    </g>
    <path d="M1148 242 V262" stroke="#4ec9a5" stroke-width="2" stroke-dasharray="3 3"/>
    <g transform="translate(1088 264)">
      <rect width="120" height="60" rx="10" fill="url(#card)" stroke="#4ec9a5" stroke-opacity="0.55" stroke-width="2"/>
      <text x="60" y="26" fill="#dbe4ec">#2 decision</text>
      <text x="60" y="44" fill="#5c6b7a">c81e…07f5</text>
      <circle cx="112" cy="8" r="8" fill="#4ec9a5"/>
    </g>
    <text x="1148" y="352" fill="#5c6b7a">hash-chained ledger</text>
  </g>
</svg>
