# Final release of the pre-rename `writ-sdk` distribution: it installs
# `provio-sdk` and keeps `import writ_sdk` (and the Writ* names) working as
# aliases, with a DeprecationWarning. See CHANGELOG 0.1.3.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "writ-sdk"
version = "0.1.3"
description = "Renamed to provio-sdk: pip install provio-sdk. This package installs provio-sdk and keeps `import writ_sdk` working."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Bhaskar Gurram", email = "gurrambhaskar.ai@gmail.com" }]
dependencies = ["provio-sdk==0.1.3"]
classifiers = ["Development Status :: 7 - Inactive"]

[project.urls]
Source = "https://github.com/writ-agent/provio"

[tool.setuptools]
packages = ["writ_sdk"]
