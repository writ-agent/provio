# Shared policy-test corpus (INTERFACES.md Contract 2: every engine — native,
# Rego, Cedar — must agree on these). Evaluated against examples/provio.yaml.
# Each fixture may instead carry its own inline `policy` (see redact.yaml).

- name: destructive rm -rf denied
  ctx:
    tool: bash
    args: { command: "rm -rf /" }
  expect: { verdict: deny, rule_id: block-destructive-shell }

- name: DROP TABLE asks (irreversible)
  ctx:
    tool: postgres.query
    args: { query: "DROP TABLE users;" }
  expect: { verdict: ask, rule_id: protect-production-db }

- name: disallowed egress denied
  ctx:
    tool: http
    args: { url: "https://evil.example.net/exfil" }
  expect: { verdict: deny, rule_id: egress-allowlist }

- name: allowed egress host falls through to default ask
  ctx:
    tool: http
    args: { url: "https://api.github.com/repos/writai/provio" }
  expect: { verdict: ask, rule_id: default }

- name: .env read denied
  ctx:
    tool: fs.read
    args: { path: "/home/app/.env" }
  expect: { verdict: deny, rule_id: never-read-secrets }

- name: unmatched call hits default ask
  ctx:
    tool: bash
    args: { command: "ls -la" }
  expect: { verdict: ask, rule_id: default }
