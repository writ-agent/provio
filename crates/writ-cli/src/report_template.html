<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{title}</title>
<style>
  :root {{ --bg: #ffffff; --fg: #18181b; --muted: #71717a; --card: #f4f4f5; --line: #e4e4e7;
          --deny-bg: #fee2e2; --deny-fg: #991b1b; --ask-bg: #fef3c7; --ask-fg: #92400e;
          --allow-bg: #dcfce7; --allow-fg: #166534; --redact-bg: #cffafe; --redact-fg: #155e75; --accent: #4f46e5; }}
  @media (prefers-color-scheme: dark) {{
    :root {{ --bg: #0d0d0f; --fg: #e6e6e6; --muted: #a1a1aa; --card: #17171a; --line: #26262b;
            --deny-bg: #7f1d1d; --deny-fg: #fecaca; --ask-bg: #713f12; --ask-fg: #fde68a;
            --allow-bg: #14532d; --allow-fg: #bbf7d0; --redact-bg: #164e63; --redact-fg: #a5f3fc; --accent: #818cf8; }}
  }}
  body {{ font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg);
         margin: 2rem auto; max-width: 1100px; padding: 0 16px; line-height: 1.45; }}
  code, pre {{ font-family: ui-monospace, Consolas, monospace; font-size: 0.85rem; }}
  pre {{ background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 0.75rem; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }}
  h1 {{ letter-spacing: -0.02em; margin-bottom: 0.2rem; }}
  h2 {{ margin-top: 2rem; border-bottom: 1px solid var(--line); padding-bottom: 0.3rem; }}
  .sub, .muted {{ color: var(--muted); margin: 0.2rem 0; }}
  .cards {{ display: flex; gap: 0.75rem; margin: 1.5rem 0; flex-wrap: wrap; }}
  .card {{ background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 0.8rem 1.2rem; min-width: 110px; }}
  .card b {{ font-size: 1.7rem; display: block; }}
  .card.deny b {{ color: var(--deny-fg); }} .card.ask b {{ color: var(--ask-fg); }} .card.redact b {{ color: var(--redact-fg); }}
  table {{ width: 100%; border-collapse: collapse; font-size: 0.88rem; }}
  th, td {{ text-align: left; padding: 0.35rem 0.5rem; border-bottom: 1px solid var(--line); vertical-align: top; }}
  td code {{ word-break: break-all; }}
  details {{ margin: 0.5rem 0; }} summary {{ cursor: pointer; padding: 0.3rem 0; }}
  .badge {{ padding: 0.05rem 0.45rem; border-radius: 4px; font-weight: 600; font-size: 0.8rem; white-space: nowrap; }}
  .badge.allow {{ background: var(--allow-bg); color: var(--allow-fg); }}
  .badge.deny  {{ background: var(--deny-bg); color: var(--deny-fg); }}
  .badge.ask   {{ background: var(--ask-bg); color: var(--ask-fg); }}
  .badge.redact {{ background: var(--redact-bg); color: var(--redact-fg); }}
  .ok {{ color: var(--allow-fg); font-weight: 600; }} .bad {{ color: var(--deny-fg); font-weight: 600; }}
  footer {{ margin-top: 2.5rem; color: var(--muted); font-size: 0.8rem; }}
  @media (max-width: 640px) {{ table {{ font-size: 0.8rem; }} th:nth-child(2), td:nth-child(2) {{ display: none; }} }}
</style>
</head>
<body>
{body}
<footer>Generated {generated} by writ {version} from the hash-chained ledger. Self-contained: no scripts, no external requests.</footer>
</body>
</html>
