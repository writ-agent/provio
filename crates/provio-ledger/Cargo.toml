[package]
name = "provio-ledger"
description = "Append-only hash-chained provenance ledger with verify, receipts and anchors."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
provio-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
rusqlite = { workspace = true, optional = true }
# Postgres store (`postgres` feature): the synchronous client over
# tokio-postgres, TLS via rustls with the ring provider (no aws-lc-rs, so no
# CMake/NASM on Windows), roots from the OS store or `sslrootcert`.
postgres = { version = "0.19", optional = true }
tokio-postgres-rustls = { version = "0.14", optional = true, default-features = false, features = ["ring"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = { version = "0.8", optional = true }
percent-encoding = { version = "2", optional = true }


[features]
default = []
sqlite = ["dep:rusqlite"]
postgres = [
    "dep:postgres",
    "dep:tokio-postgres-rustls",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:percent-encoding",
]
