[package]
name = "provio-sandbox-docker"
description = "Docker sandbox backend for provio: runs approved calls inside a user-supplied container image (cgroups v2 + namespaces)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
provio-core.workspace = true
# No docker-API crate: bollard 0.21 (the natural client) does not build in
# this environment — its tokio -> windows-sys 0.61 chain needs raw-dylib
# import libraries and this GNU toolchain's dlltool cannot spawn an assembler
# (`dlltool.exe: CreateProcess` — ADR-007), and the icu_normalizer_data build
# script it pulls in via url -> idna is blocked by a Windows Application
# Control policy (os error 4551). The backend therefore drives the `docker`
# CLI, which speaks to the same daemon with zero build-script or FFI surface.
# Migrating to bollard is a follow-up for environments without these
# constraints (e.g. CI runners, ADR-006).
