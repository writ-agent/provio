[package]
name = "provio-mcp"
description = "MCP client/server proxy (stdio, SSE, streamable HTTP), tool schema discovery, credential injection at dispatch."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
provio-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Upstream HTTP client (Streamable HTTP / legacy SSE). rustls + ring +
# webpki-roots; no OpenSSL. Already in the binary via provio-receipts.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Agent-facing HTTP/1.1 request parsing (also a ureq dependency).
httparse = "1"
# Mcp-Name / Mcp-Param-* `=?base64?…?=` sentinel decoding.
base64 = "0.22"
