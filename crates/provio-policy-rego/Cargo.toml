[package]
name = "provio-policy-rego"
description = "Rego policy engine backend for provio: provio.yaml semantics evaluated through a Rego evaluator, producing the shared verdict IR."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
provio-core.workspace = true
provio-policy.workspace = true
serde_json.workspace = true
# Minimal feature set (ADR-006/007: this environment builds with the GNU
# toolchain, whose dlltool cannot produce raw-dylib import libs — regorus's
# `std` feature pulls rand/getrandom and parking_lot, both of which fail
# here; the no_std Engine API is alloc-only and covers everything provio
# needs). `rvm` (the compiled-Regel VM, postcard/indexmap) is off as it is
# unnecessary: without it regorus uses its AST interpreter, and a smaller
# dependency graph keeps every machine able to build the workspace.
# "regex" enables the regex.* builtins — implemented with the same Rust
# `regex` crate the native engine compiles `matches` with.
regorus = { version = "0.12", default-features = false, features = ["arc", "regex"] }