# provio.yaml — the policy that governs the fixture agent in this demo.
#
# Four verdicts, first match wins, unmatched calls hit `default`.
# The order matters: the deny rules sit above the broad read allow, so a
# read of a secret is refused before the "reads are fine" rule can match it.
version: 1
default: ask                          # fail closed: anything unmatched waits for a human

rules:
  # 1. The agent must never read credentials, even to "check" them.
  - id: never-read-secrets
    when: path matches "\\.env|id_rsa|\\.pem$|credentials$"
    verdict: deny
    reason: "Secrets are off-limits to the agent by policy."

  # 2. Destructive shell commands are refused outright.
  - id: block-destructive-shell
    when: tool == "bash" and command matches "rm -rf|mkfs|dd if=|:\(\)\{"
    verdict: deny
    reason: "Destructive system command. Narrow the path and retry."

  # 3. Egress allow-list: the agent may only reach hosts we named.
  #    Everything else — including attacker.example — is denied.
  - id: egress-allowlist
    when: tool == "http" and not url.host in hosts.allowed
    verdict: deny
    reason: "Host is not on the egress allow-list."

  # 4. Ordinary reads inside the workspace are fine (this is how the
  #    poisoned README gets into the model's context in the first place).
  - id: allow-workspace-reads
    when: tool == "fs.read"
    verdict: allow
    reason: "Reads inside the workspace are permitted."

hosts:
  allowed: [api.github.com, registry.npmjs.org]
