# provio.yaml, written by `provio init`. Every tool call your agents make is
# checked against this file before it runs, and every decision is
# recorded in a tamper-evident ledger (`provio log`, `provio verify`).
#
# default: what happens to a call no rule names. `allow` keeps agents fast;
# `ask` makes you approve everything the rules below do not decide.
version: 1
default: allow

# Bundled policy packs. `floor`: the disasters no agent should cause on its
# own (wiping ~ or /, force-pushing main, reading SSH/cloud keys, disabling
# its own hooks); `secrets-guard`: keys and tokens stay out of the model.
# More: aws-safety, gcp-azure-safety, github-safety, database-safety,
# k8s-prod, terraform-safety, package-publish-guard, pii-redaction.
packs: [floor, secrets-guard]

# Your own rules; first match wins, and the packs' deny/ask rules come
# first. Try one: provio test "git push --force origin main"
rules: []

# Session guards (these are the defaults): ask before a session that read
# a credential file sends data out, and when an agent repeats the same call
# 5 times in a row. call_budget caps the tool calls of one session (0: none).
# session_guards:
#   secret_then_egress: ask   # ask | deny | off
#   repeated_call: ask        # ask | deny | off
#   repeated_call_limit: 5
#   call_budget: 0
#   over_budget: ask          # ask | deny
