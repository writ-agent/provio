[advisories]
version = 2
yanked = "deny"
ignore = [
    # unsafe-libyaml (via serde_yaml 0.9) was archived in 2024 and marked
    # unmaintained on 2026-10-12. Not a vulnerability; no patched version.
    # Remove once provio moves off serde_yaml: https://github.com/writ-agent/provio/issues/53
    { id = "RUSTSEC-2024-0449", reason = "unmaintained notice only; migration tracked in #53" },
]

[licenses]
version = 2
# Permissive licenses compatible with shipping provio under Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",   # webpki-roots (Mozilla CA list)
    "ISC",                   # ring, rustls-webpki, untrusted
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]