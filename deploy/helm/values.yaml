mode: sidecar
replicaCount: 1

image:
  repository: ghcr.io/writ-agent/provio
  tag: "wave3-stub"
  pullPolicy: IfNotPresent

serviceAccount:
  name: provio
  annotations: {}

service:
  type: ClusterIP
  port: 8080

policy:
  default: ask
  content: |
    version: 1
    default: ask
    rules: []

ledger:
  backend: postgres-object-store
  postgres:
    existingSecret: provio-postgres
    urlKey: database-url
  objectStore:
    existingSecret: provio-object-store
    bucketKey: bucket
    endpointKey: endpoint
    regionKey: region

enterprise:
  sso:
    enabled: false
    provider: oidc
    existingSecret: provio-sso
  siem:
    enabled: false
    existingSecret: provio-siem
  vault:
    enabled: false
    existingSecret: provio-vault
  kms:
    enabled: false
    existingSecret: provio-kms

networkPolicy:
  enabled: true
  allowDns: true
  egressCidrs: []

resources: {}
