apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: "{{ .Release.Name }}-provio-default-deny-egress"
  labels:
    app.kubernetes.io/name: provio
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: provio
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: "{{ .Values.service.port }}"
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
