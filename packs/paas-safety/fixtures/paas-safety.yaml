# Fixtures for packs/paas-safety, run against the pack wrapped in
# `version: 1` / `default: ask` (unmatched -> rule_id: default). Bash args
# are shaped like Claude Code's Bash tool input; file tools are already
# mapped (fs.read / fs.write with `path`).

# --- deny: token printing -----------------------------------------------------
- name: heroku auth:token denied
  ctx: { tool: bash, args: { command: "heroku auth:token" } }
  expect: { verdict: deny, rule_id: paas-token-print-denied }

- name: flyctl.exe auth token denied
  ctx: { tool: bash, args: { command: "flyctl.exe auth token" } }
  expect: { verdict: deny, rule_id: paas-token-print-denied }

- name: npx wrangler auth token denied
  ctx: { tool: bash, args: { command: "npx wrangler auth token --json" } }
  expect: { verdict: deny, rule_id: paas-token-print-denied }

- name: firebase login:ci denied
  ctx: { tool: bash, args: { command: "firebase login:ci --no-localhost" } }
  expect: { verdict: deny, rule_id: paas-token-print-denied }

- name: reading the Vercel auth.json with a file tool denied
  ctx: { tool: fs.read, args: { path: "C:\\Users\\dev\\AppData\\Roaming\\com.vercel.cli\\Data\\auth.json" } }
  expect: { verdict: deny, rule_id: paas-token-print-denied }

- name: cat ~/.fly/config.yml denied
  ctx: { tool: bash, args: { command: "cat ~/.fly/config.yml" } }
  expect: { verdict: deny, rule_id: paas-token-print-denied }

- name: reading the Supabase access token denied
  ctx: { tool: fs.read, args: { path: "/home/dev/.supabase/access-token" } }
  expect: { verdict: deny, rule_id: paas-token-print-denied }

- name: fly auth whoami is left to the default
  ctx: { tool: bash, args: { command: "fly auth whoami" } }
  expect: { verdict: ask, rule_id: default }

- name: project fly.toml read is not a token file
  ctx: { tool: fs.read, args: { path: "/work/app/fly.toml" } }
  expect: { verdict: ask, rule_id: default }

