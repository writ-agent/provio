# Fixtures for packs/outbound-comms-guard, run against the pack wrapped in
# `version: 1` / `default: ask` (unmatched -> rule_id: default). MCP cases
# are shaped like Claude Code's `mcp__<server>__<tool>` after mapping
# (tool=<tool>, server=<server>); bash cases like its Bash tool input.

# --- MCP: send-shaped names on any server ---------------------------------
- name: Gmail MCP send_email asks
  ctx: { tool: send_email, server: gmail, args: { to: ["a@example.com"], subject: "hi", body: "x" } }
  expect: { verdict: ask, rule_id: comms-mcp-send-asks }

- name: Slack reference server slack_post_message asks
  ctx: { tool: slack_post_message, server: slack, args: { channel_id: "C1", text: "hi" } }
  expect: { verdict: ask, rule_id: comms-mcp-send-asks }

- name: send_message on an unlisted server still asks
  ctx: { tool: send_message, server: acme-bridge, args: { to: "ops", text: "hi" } }
  expect: { verdict: ask, rule_id: comms-mcp-send-asks }

- name: Microsoft 365 kebab send-mail asks
  ctx: { tool: send-mail, server: ms365, args: {} }
  expect: { verdict: ask, rule_id: comms-mcp-send-asks }

- name: camelCase sendMessage asks
  ctx: { tool: sendMessage, server: tg, args: { chat_id: 1, text: "hi" } }
  expect: { verdict: ask, rule_id: comms-mcp-send-asks }

- name: send_sms asks
  ctx: { tool: send_sms, server: notify, args: { to: "+15550100", body: "code 1234" } }
  expect: { verdict: ask, rule_id: comms-mcp-send-asks }

- name: make_outbound_call asks
  ctx: { tool: make_outbound_call, server: elevenlabs, args: { to_number: "+15550100" } }
  expect: { verdict: ask, rule_id: comms-mcp-send-asks }

- name: create_tweet asks
  ctx: { tool: create_tweet, server: x-api, args: { text: "hello" } }
  expect: { verdict: ask, rule_id: comms-mcp-send-asks }

- name: Gmail send_draft sends, so it asks
  ctx: { tool: send_draft, server: gmail, args: { draft_id: "r1" } }
  expect: { verdict: ask, rule_id: comms-mcp-messaging-server-asks }

