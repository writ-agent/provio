# Fixtures for packs/windows-safety, run against the pack wrapped in
# `version: 1` / `default: ask` (unmatched -> rule_id: default).

# --- Defender -----------------------------------------------------------------
- name: Set-MpPreference disable realtime denied
  ctx: { tool: bash, args: { command: "Set-MpPreference -DisableRealtimeMonitoring $true" } }
  expect: { verdict: deny, rule_id: win-defender-disable-denied }

- name: Set-MpPreference disable realtime with 1 denied
  ctx: { tool: bash, args: { command: "powershell -Command \"Set-MpPreference -DisableRealtimeMonitoring 1\"" } }
  expect: { verdict: deny, rule_id: win-defender-disable-denied }

- name: Add-MpPreference exclusion path denied
  ctx: { tool: bash, args: { command: "Add-MpPreference -ExclusionPath 'C:\\temp\\payload'" } }
  expect: { verdict: deny, rule_id: win-defender-disable-denied }

- name: sc stop WinDefend denied
  ctx: { tool: bash, args: { command: "sc stop WinDefend" } }
  expect: { verdict: deny, rule_id: win-defender-disable-denied }

- name: sc.exe config Sense disabled denied
  ctx: { tool: bash, args: { command: "sc.exe config Sense start= disabled" } }
  expect: { verdict: deny, rule_id: win-defender-disable-denied }

- name: Set-MpPreference re-enable realtime not matched
  ctx: { tool: bash, args: { command: "Set-MpPreference -DisableRealtimeMonitoring $false" } }
  expect: { verdict: ask, rule_id: default }

- name: Get-MpPreference read not matched
  ctx: { tool: bash, args: { command: "Get-MpPreference | Select-Object DisableRealtimeMonitoring" } }
  expect: { verdict: ask, rule_id: default }

