# Fixtures for packs/payments-guard, run against the pack wrapped in
# `version: 1` / `default: ask` (unmatched -> rule_id: default). Bash args
# are shaped like Claude Code's Bash tool input; MCP cases like its
# `mcp__<server>__<tool>` after mapping (tool=<tool>, server=<server>).

# --- deny: live-mode Stripe writes ------------------------------------------
- name: stripe refunds create --live denied
  ctx: { tool: bash, args: { command: "stripe refunds create --charge=ch_123 --live" } }
  expect: { verdict: deny, rule_id: pay-stripe-live-write-denied }

- name: stripe --live before the resource denied
  ctx: { tool: bash, args: { command: "stripe --live subscriptions cancel sub_123" } }
  expect: { verdict: deny, rule_id: pay-stripe-live-write-denied }

- name: stripe post --live denied
  ctx: { tool: bash, args: { command: "stripe post /v1/payouts -d amount=5000 -d currency=usd --live" } }
  expect: { verdict: deny, rule_id: pay-stripe-live-write-denied }

- name: curl to the Stripe API with a live key and data denied
  ctx: { tool: bash, args: { command: "curl https://api.stripe.com/v1/refunds -u sk_live_51Hx0000: -d charge=ch_123" } }
  expect: { verdict: deny, rule_id: pay-stripe-live-write-denied }

- name: "near miss: live-mode list is a read"
  ctx: { tool: bash, args: { command: "stripe customers list --limit 5 --live" } }
  expect: { verdict: ask, rule_id: default }

# --- ask: Stripe CLI money movement ----------------------------------------
- name: stripe charges create asks
  ctx: { tool: bash, args: { command: "stripe charges create --amount=2000 --currency=usd --source=tok_visa" } }
  expect: { verdict: ask, rule_id: pay-stripe-money-movement-asks }

- name: stripe payment_intents confirm asks
  ctx: { tool: bash, args: { command: "stripe payment_intents confirm pi_123 --payment-method=pm_card_visa" } }
  expect: { verdict: ask, rule_id: pay-stripe-money-movement-asks }

- name: stripe payouts create asks
  ctx: { tool: bash, args: { command: "stripe payouts create --amount=10000 --currency=usd" } }
  expect: { verdict: ask, rule_id: pay-stripe-money-movement-asks }

- name: stripe post /v1/refunds asks
  ctx: { tool: bash, args: { command: "stripe post /v1/refunds -d payment_intent=pi_123" } }
  expect: { verdict: ask, rule_id: pay-stripe-money-movement-asks }

