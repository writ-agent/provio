# Fixtures for packs/ci-config-guard, run against the pack wrapped in
# `version: 1` / `default: ask` (unmatched -> rule_id: default). Bash args
# are shaped like Claude Code's Bash tool input; file tools are already
# mapped (fs.read / fs.write with `path`).

# --- deny: Actions permissions / runners / environments -----------------------
- name: gh api PUT actions/permissions denied
  ctx: { tool: bash, args: { command: "gh api -X PUT repos/acme/app/actions/permissions -F enabled=true -f allowed_actions=all" } }
  expect: { verdict: deny, rule_id: ci-actions-permissions-change-denied }

- name: implicit POST with -f to workflow permissions denied
  ctx: { tool: bash, args: { command: "gh api repos/acme/app/actions/permissions/workflow -f default_workflow_permissions=write" } }
  expect: { verdict: deny, rule_id: ci-actions-permissions-change-denied }

- name: runner registration token denied
  ctx: { tool: bash, args: { command: "gh api -X POST repos/acme/app/actions/runners/registration-token --jq .token" } }
  expect: { verdict: deny, rule_id: ci-actions-permissions-change-denied }

- name: environment protection change denied
  ctx: { tool: bash, args: { command: "gh.exe api --method PUT repos/acme/app/environments/production --input env.json" } }
  expect: { verdict: deny, rule_id: ci-actions-permissions-change-denied }

- name: reading actions/permissions is left to the default
  ctx: { tool: bash, args: { command: "gh api repos/acme/app/actions/permissions" } }
  expect: { verdict: ask, rule_id: default }

- name: reading an environment is left to the default
  ctx: { tool: bash, args: { command: "gh api repos/acme/app/environments/production --jq .protection_rules" } }
  expect: { verdict: ask, rule_id: default }

