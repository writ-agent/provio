  ctx: { tool: bash, args: { command: "gh workflow run deploy.yml --ref main -f env=production" } }
  expect: { verdict: ask, rule_id: ci-pipeline-trigger-asks }

- name: gh workflow disable asks
  ctx: { tool: bash, args: { command: "gh -R acme/app workflow disable codeql.yml" } }
  expect: { verdict: ask, rule_id: ci-pipeline-trigger-asks }

- name: gh run rerun asks
  ctx: { tool: bash, args: { command: "GH_TOKEN=$T gh run rerun 123456 --failed" } }
