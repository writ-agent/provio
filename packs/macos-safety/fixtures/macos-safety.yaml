# Fixtures for packs/macos-safety, run against the pack wrapped in
# `version: 1` / `default: ask` (unmatched -> rule_id: default).

# --- SIP / Gatekeeper / FileVault ---------------------------------------------
- name: csrutil disable denied
  ctx: { tool: bash, args: { command: "csrutil disable" } }
  expect: { verdict: deny, rule_id: mac-sip-disable-denied }

- name: sudo csrutil clear denied
  ctx: { tool: bash, args: { command: "sudo csrutil clear" } }
  expect: { verdict: deny, rule_id: mac-sip-disable-denied }

- name: csrutil status not matched
  ctx: { tool: bash, args: { command: "csrutil status" } }
  expect: { verdict: ask, rule_id: default }

- name: echo about csrutil disable not matched
  ctx: { tool: bash, args: { command: "echo 'run csrutil disable in recovery'" } }
  expect: { verdict: ask, rule_id: default }

- name: spctl master-disable denied
  ctx: { tool: bash, args: { command: "sudo spctl --master-disable" } }
  expect: { verdict: deny, rule_id: mac-gatekeeper-disable-denied }

- name: spctl global-disable denied
  ctx: { tool: bash, args: { command: "spctl --global-disable" } }
  expect: { verdict: deny, rule_id: mac-gatekeeper-disable-denied }

- name: spctl status not matched
  ctx: { tool: bash, args: { command: "spctl --status" } }
  expect: { verdict: ask, rule_id: default }

- name: spctl master-enable not matched
  ctx: { tool: bash, args: { command: "sudo spctl --master-enable" } }
  expect: { verdict: ask, rule_id: default }

- name: fdesetup disable denied
  ctx: { tool: bash, args: { command: "sudo fdesetup disable" } }
  expect: { verdict: deny, rule_id: mac-filevault-disable-denied }

- name: fdesetup status not matched
  ctx: { tool: bash, args: { command: "fdesetup status" } }
  expect: { verdict: ask, rule_id: default }

