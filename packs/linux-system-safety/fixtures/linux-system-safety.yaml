# --- ld.so.preload ------------------------------------------------------------
- name: echo into ld.so.preload denied
  ctx: { tool: bash, args: { command: "echo /tmp/evil.so > /etc/ld.so.preload" } }
  expect: { verdict: deny, rule_id: linux-ld-preload-denied }

- name: tee ld.so.preload denied
  ctx: { tool: bash, args: { command: "echo /tmp/x.so | sudo tee -a /etc/ld.so.preload" } }
  expect: { verdict: deny, rule_id: linux-ld-preload-denied }

- name: fs.write ld.so.preload denied
  ctx: { tool: fs.write, args: { path: "/etc/ld.so.preload", content: "/tmp/evil.so" } }
  expect: { verdict: deny, rule_id: linux-ld-preload-denied }

- name: cat ld.so.preload read not matched
  ctx: { tool: bash, args: { command: "cat /etc/ld.so.preload" } }
  expect: { verdict: ask, rule_id: default }

# --- passwd / shadow ----------------------------------------------------------
- name: append backdoor to passwd denied
  ctx: { tool: bash, args: { command: "echo 'bd:x:0:0::/root:/bin/bash' >> /etc/passwd" } }
  expect: { verdict: deny, rule_id: linux-passwd-shadow-write-denied }

- name: sed -i on shadow denied
  ctx: { tool: bash, args: { command: "sudo sed -i 's/root:.*/root::/' /etc/shadow" } }
  expect: { verdict: deny, rule_id: linux-passwd-shadow-write-denied }

- name: fs.write shadow denied
  ctx: { tool: fs.write, args: { path: "/etc/shadow", content: "root::" } }
  expect: { verdict: deny, rule_id: linux-passwd-shadow-write-denied }

- name: fs.read passwd not matched by write rule
  ctx: { tool: fs.read, args: { path: "/etc/passwd" } }
  expect: { verdict: ask, rule_id: default }

- name: grep passwd file not matched
  ctx: { tool: bash, args: { command: "grep root /etc/passwd" } }
  expect: { verdict: ask, rule_id: default }

