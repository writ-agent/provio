# Fixtures for packs/linux-system-safety, run against the pack wrapped in
# `version: 1` / `default: ask` (unmatched -> rule_id: default).

# --- SELinux / AppArmor -------------------------------------------------------
- name: setenforce 0 denied
  ctx: { tool: bash, args: { command: "sudo setenforce 0" } }
  expect: { verdict: deny, rule_id: linux-mac-disable-denied }

- name: setenforce Permissive denied
  ctx: { tool: bash, args: { command: "setenforce Permissive" } }
  expect: { verdict: deny, rule_id: linux-mac-disable-denied }

- name: aa-teardown denied
  ctx: { tool: bash, args: { command: "sudo aa-teardown" } }
