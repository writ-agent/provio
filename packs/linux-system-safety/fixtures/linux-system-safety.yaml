- name: setenforce 1 not matched
  ctx: { tool: bash, args: { command: "sudo setenforce 1" } }
  expect: { verdict: ask, rule_id: default }

- name: getenforce not matched
  ctx: { tool: bash, args: { command: "getenforce" } }
