# Fixtures for packs/secrets-guard, run against the pack wrapped in
# `version: 1` / `default: ask` (unmatched -> rule_id: default).
# fs.read / fs.write cases are shaped like Claude Code's Read / Write / Edit
# input after mapping ({file_path} -> path); bash cases like Bash/PowerShell.
# The masking itself is proven by ../redact-samples.yaml.

# --- deny: credential files by path --------------------------------------
- name: Read ~/.ssh/id_ed25519 denied
  ctx: { tool: fs.read, args: { file_path: "/home/dev/.ssh/id_ed25519" } }
  expect: { verdict: deny, rule_id: secrets-ssh-keys-denied }

- name: Read Windows SSH key with backslashes denied
  ctx: { tool: fs.read, args: { file_path: 'C:\Users\dev\.ssh\id_rsa' } }
  expect: { verdict: deny, rule_id: secrets-ssh-keys-denied }

- name: Write to authorized_keys denied (persistence)
  ctx: { tool: fs.write, args: { file_path: "/home/dev/.ssh/authorized_keys", content: "ssh-ed25519 AAAA attacker" } }
  expect: { verdict: deny, rule_id: secrets-ssh-keys-denied }

- name: Read ~/.aws/credentials denied
  ctx: { tool: fs.read, args: { file_path: "/Users/dev/.aws/credentials" } }
  expect: { verdict: deny, rule_id: secrets-cloud-credentials-denied }

