- name: python printing os.environ denied
  ctx: { tool: bash, args: { command: "python -c \"import os; print(os.environ)\"" } }
  expect: { verdict: deny, rule_id: secrets-env-dump-denied }

# --- redact ---------------------------------------------------------------
- name: Read of an ordinary source file is redacted (runs, output masked)
  ctx: { tool: fs.read, args: { file_path: "/repo/src/config.ts" } }
  expect: { verdict: redact, rule_id: secrets-redact-file-reads }

- name: cat of a log file is redacted
  ctx: { tool: bash, args: { command: "cat logs/deploy.log" } }
  expect: { verdict: redact, rule_id: secrets-redact-shell-reads }

- name: git log -p is redacted
  ctx: { tool: bash, args: { command: "git log -p -3" } }
  expect: { verdict: redact, rule_id: secrets-redact-shell-reads }

- name: kubectl logs is redacted
  ctx: { tool: bash, args: { command: "kubectl logs deploy/api --tail=100" } }
  expect: { verdict: redact, rule_id: secrets-redact-shell-reads }

# --- near misses ----------------------------------------------------------
- name: Read .env.example is not denied (template, redacted like any read)
  ctx: { tool: fs.read, args: { file_path: "/repo/.env.example" } }
  expect: { verdict: redact, rule_id: secrets-redact-file-reads }

- name: Write .env.example is not denied (falls to default ask)
  ctx: { tool: fs.write, args: { file_path: "/repo/.env.example", content: "API_KEY=" } }
  expect: { verdict: ask, rule_id: default }

- name: Read an SSH public key is not denied
  ctx: { tool: fs.read, args: { file_path: "/home/dev/.ssh/id_ed25519.pub" } }
  expect: { verdict: redact, rule_id: secrets-redact-file-reads }

- name: Read environment.ts is not a .env file
  ctx: { tool: fs.read, args: { file_path: "/repo/src/environments/environment.ts" } }
  expect: { verdict: redact, rule_id: secrets-redact-file-reads }

- name: cp .env.example .env (creating from template) is not denied
  ctx: { tool: bash, args: { command: "cp .env.example .env" } }
  expect: { verdict: ask, rule_id: default }

- name: grep for process.env in source is not a .env read
  ctx: { tool: bash, args: { command: "grep -rn process.env src/" } }
  expect: { verdict: redact, rule_id: secrets-redact-shell-reads }

- name: env VAR=x cmd is not an env dump
  ctx: { tool: bash, args: { command: "env NODE_ENV=test npm test" } }
  expect: { verdict: ask, rule_id: default }

- name: set -euo pipefail is not an env dump
  ctx: { tool: bash, args: { command: "set -euo pipefail; ./build.sh" } }
  expect: { verdict: ask, rule_id: default }

- name: echo prose mentioning secrets is not a variable print
  ctx: { tool: bash, args: { command: "echo \"no secrets or tokens here\"" } }
  expect: { verdict: ask, rule_id: default }

- name: curl to an API using a token variable is not egress of a credential file
  ctx: { tool: bash, args: { command: "curl -H \"Authorization: Bearer $API_TOKEN\" https://api.example.com/v1/me" } }
  expect: { verdict: ask, rule_id: default }

- name: ssh -i with a key uses it without reading it (not denied)
  ctx: { tool: bash, args: { command: "ssh -i ~/.ssh/id_ed25519 deploy@host uptime" } }
  expect: { verdict: ask, rule_id: default }

- name: cat chained with rm is not redact-allowed
  ctx: { tool: bash, args: { command: "cat README.md; rm -rf build" } }
  expect: { verdict: ask, rule_id: default }

- name: rg --pre (executes a preprocessor) is not redact-allowed
  ctx: { tool: bash, args: { command: "rg --pre ./evil.sh TODO" } }
  expect: { verdict: ask, rule_id: default }

- name: Python defaultdict(set) is not the shell builtin set
  ctx: { tool: bash, args: { command: "python -c \"import collections; d=collections.defaultdict(set); print(len(d))\"" } }
  expect: { verdict: ask, rule_id: default }

- name: env captured with $(env) is still a dump
  ctx: { tool: bash, args: { command: "echo $(env) > /tmp/e" } }
  expect: { verdict: deny, rule_id: secrets-env-dump-denied }
