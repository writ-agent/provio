# Fixtures for packs/floor, run against the pack wrapped in `version: 1` /
# `default: ask` (unmatched -> rule_id: default). Bash args are shaped like
# Claude Code's Bash tool input; file tools are already mapped (fs.read /
# fs.write with `path`).

# --- rm of home / root ------------------------------------------------------
- name: rm -rf ~ denied
  ctx: { tool: bash, args: { command: "rm -rf ~" } }
  expect: { verdict: deny, rule_id: floor-rm-home-or-root-denied }

- name: rm -rf "$HOME" (claude-code#88462 shape) denied
  ctx: { tool: bash, args: { command: "rm -rf \"$HOME\"" } }
  expect: { verdict: deny, rule_id: floor-rm-home-or-root-denied }

- name: trap 'rm -rf "$HOME"' EXIT denied
