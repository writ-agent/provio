  expect: { verdict: ask, rule_id: default }

- name: curl piped to python -m json.tool is not remote exec
  ctx: { tool: bash, args: { command: "curl -s https://api.github.com/repos/a/b | python3 -m json.tool" } }
  expect: { verdict: ask, rule_id: default }

