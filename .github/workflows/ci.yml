name: ci
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Kernel sandbox tests fail (instead of skipping) if the runner cannot
      # enforce the boundary: CI must prove enforcement on every OS.
      PROVIO_SANDBOX_REQUIRE_ENFORCEMENT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  benches:
    name: benches compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/provio-bench
      # Compile only: numbers from shared CI runners are not publishable.
      - run: cargo bench --no-run
        working-directory: crates/provio-bench

  cargo-deny:
    name: licenses, advisories, sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources

  typescript:
    name: typescript adapter (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: adapters/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: adapters/typescript/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  python:
    name: python adapter (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: adapters/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # --no-deps: the provio pin names the version being released, which
      # may not be on PyPI yet; the tests use a fake gateway, not the binary.
      - run: python -m pip install --quiet --no-deps -e .
      - run: python -m pip install --quiet pytest pytest-asyncio "langgraph>=1.0" "langchain-core>=1.0" "openai-agents>=0.22" "claude-agent-sdk>=0.2"
      - run: python -m pytest -q

  versions:
    name: release versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_versions.py

  playground:
    name: playground wasm is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: PLAYGROUND_TOOLCHAIN=1.98.1 bash scripts/build_playground.sh --check
      - run: git diff --exit-code -- site/assets/playground/
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test crates/provio-wasm/tests/playground.test.mjs

  ledger-postgres:
    name: ledger on Postgres 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: provio
          # Distinct from every identifier in the tests, so the
          # "password never appears in output" checks cannot match a name.
          POSTGRES_PASSWORD: pg-ci-9f3c1d
          POSTGRES_DB: provio_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U provio" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PROVIO_POSTGRES_URL: postgres://provio:pg-ci-9f3c1d@localhost:5432/provio_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p provio-ledger --all-features
      - run: cargo clippy -p provio-ledger --all-targets --all-features -- -D warnings

  action:
    name: GitHub Action (deploy/action) against the latest release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: a scratch project for the action to wire
        run: mkdir -p /tmp/proj && cd /tmp/proj && git init -q
      - id: provio
        uses: ./deploy/action
        with:
          agents: claude-code
          policy: /tmp/proj/provio.yaml
          artifact-name: ""
      - name: the action installed provio, wrote a policy and hooks, and reported
        run: |
          provio --version
          test -f /tmp/proj/provio.yaml || test -f provio.yaml
          test -f .claude/settings.json
          grep -q "check" .claude/settings.json
          test "${{ steps.provio.outputs.denied }}" = "0"

  claim-discipline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: forbid unearned assurance claims (spec section 7/15)
        run: python3 scripts/claim_lint.py

  packs:
    name: policy packs validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python3 -m pip install --quiet pyyaml
      - run: python3 scripts/validate_packs.py
