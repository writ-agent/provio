name: fuzz
on:
  schedule:
    - cron: '17 3 * * 1'   # weekly, Monday 03:17 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to run each target
        default: '300'
  pull_request:
    paths:
      - 'fuzz/**'
      - 'crates/provio-core/**'
      - 'crates/provio-policy/**'
      - 'crates/provio-ledger/**'
      - 'crates/provio-mcp/**'

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_policy_compile, fuzz_ledger_record_decode, fuzz_mcp_codec]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: run ${{ matrix.target }}
        working-directory: fuzz
        run: |
          SECS="${{ github.event.inputs.seconds }}"
          [ -z "$SECS" ] && SECS=60
          cargo fuzz run ${{ matrix.target }} -- -max_total_time="$SECS"
      - name: upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
