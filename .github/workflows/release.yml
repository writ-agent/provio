name: release

# A `vX.Y.Z` tag builds the provio binary for every supported platform and
# publishes it everywhere users install from:
#   - GitHub Release: signed binaries, checksums, SBOMs, build provenance
#   - PyPI: provio (platform wheels carrying the binary), then provio-sdk
#   - npm:  provio-cli-<os>-<cpu>, then provio, then provio-sdk
# Run it manually (workflow_dispatch) for a dry run: everything is built and
# checked, nothing is published unless `publish` is ticked.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI and npm (tag pushes always publish)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PUBLISH: ${{ github.ref_type == 'tag' || inputs.publish }}

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: every package carries the same version (and matches the tag)
        run: python3 scripts/check_versions.py ${{ github.ref_type == 'tag' && github.ref_name || '' }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  binaries:
    name: binary (${{ matrix.target }})
    needs: [versions, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, run: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, run: true }
          - { target: aarch64-apple-darwin, os: macos-latest, run: true }
          - { target: x86_64-apple-darwin, os: macos-latest, run: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, run: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      - name: build (static on Linux)
        shell: bash
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked -p provio-cli --target ${{ matrix.target }}
      - name: stage
        shell: bash
        run: |
          mkdir -p dist
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp "target/${{ matrix.target }}/release/provio$ext" "dist/provio-${{ matrix.target }}$ext"
          ls -l dist
      - name: smoke test
        if: matrix.run
        shell: bash
        run: |
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          "dist/provio-${{ matrix.target }}$ext" --version
          echo '{}' | "dist/provio-${{ matrix.target }}$ext" check --format claude-code && exit 1 || [ $? -eq 2 ]
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  wheels:
    name: wheel (${{ matrix.platform }})
    needs: [versions, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: manylinux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: auto, run: true }
          - { platform: manylinux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: auto, run: true }
          - { platform: musllinux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2, run: false }
          - { platform: musllinux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2, run: false }
          - { platform: macos-arm64, os: macos-latest, target: aarch64-apple-darwin, manylinux: '', run: true }
          - { platform: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin, manylinux: '', run: false }
          - { platform: windows-x64, os: windows-latest, target: x64, manylinux: '', run: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist -m crates/provio-cli/Cargo.toml
      - name: smoke test (install the wheel, run provio)
        if: matrix.run
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist provio
          provio --version
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: [versions, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m crates/provio-cli/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  sbom:
    needs: [versions, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --all
          cp crates/provio-cli/provio-cli.cdx.json sbom-cyclonedx.json 2>/dev/null \
            || find . -name '*.cdx.json' -path '*provio-cli*' -exec cp {} sbom-cyclonedx.json \;
      - name: SPDX SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom-spdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom-*.json

  github-release:
    needs: [binaries, sbom]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write        # Sigstore keyless signing + provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: sbom
      - name: checksums
        run: cd dist && sha256sum * > ../checksums.txt && cat ../checksums.txt
      - uses: sigstore/cosign-installer@v3
      - name: sign artifacts
        run: |
          cd dist
          for f in *; do cosign sign-blob --yes --bundle "$f.cosign-bundle" "$f"; done
          cd .. && cosign sign-blob --yes --bundle checksums.txt.cosign-bundle checksums.txt
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/provio-*
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*
            checksums.txt
            checksums.txt.cosign-bundle
            sbom/*

  pypi:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist-cli
      - name: build provio-sdk
        run: |
          python -m pip install --quiet build twine
          python -m build --outdir dist-sdk adapters/python
          python -m twine check dist-cli/* dist-sdk/*
          ls -l dist-cli dist-sdk
      # provio first: provio-sdk pins it exactly.
      - name: publish provio
        if: env.PUBLISH == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist-cli
          skip-existing: true
      - name: publish provio-sdk
        if: env.PUBLISH == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist-sdk
          skip-existing: true

  npm:
    needs: [binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # npm provenance
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          merge-multiple: true
          path: bins
      - name: platform packages
        run: |
          version=$(node -p "require('./packaging/npm/cli/package.json').version")
          node packaging/npm/make_platform_packages.mjs bins npm-out "$version"
      # Platform packages first, then the launcher that depends on them; the
      # SDK is built and tested against those published packages, then
      # published. Versions already on the registry are skipped (re-runs).
      - name: publish the binary packages and the provio launcher
        shell: bash
        run: |
          set -euo pipefail
          flag="--dry-run"; [ "$PUBLISH" = "true" ] && flag="--provenance"
          publish() {
            local dir="$1" name ver
            name=$(node -p "require('./$dir/package.json').name")
            ver=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "skip $name@$ver (already published)"; return
            fi
            (cd "$dir" && npm publish --access public $flag)
          }
          for d in npm-out/*/; do publish "${d%/}"; done
          publish packaging/npm/cli
      - name: build and test provio-sdk
        working-directory: adapters/typescript
        run: |
          # `npm ci` needs the launcher on the registry (a dry run has not
          # published it, so fall back to installing without it).
          npm ci || npm install --no-audit --no-fund --omit=optional
          npm run build && npm test
      - name: publish provio-sdk
        shell: bash
        run: |
          set -euo pipefail
          flag="--dry-run"; [ "$PUBLISH" = "true" ] && flag="--provenance"
          name=$(node -p "require('./adapters/typescript/package.json').name")
          ver=$(node -p "require('./adapters/typescript/package.json').version")
          if npm view "$name@$ver" version >/dev/null 2>&1; then
            echo "skip $name@$ver (already published)"
          else
            (cd adapters/typescript && npm publish --access public $flag)
          fi
